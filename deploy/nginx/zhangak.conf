map $http_upgrade $zhangak_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name zhangak.com platform.zhangak.com offline.zhangak.com admin.zhangak.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zhangak.com platform.zhangak.com offline.zhangak.com admin.zhangak.com;

    ssl_certificate /etc/letsencrypt/live/zhangak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhangak.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZhangakTLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP, scoped to what is actually enforceable today.
    #
    # `frame-src` is an allowlist, not a relaxation: without it any origin
    # could be framed, and this pins framing to the two YouTube hosts the
    # lesson player uses (the nocookie host serves the embed, the main host
    # serves the IFrame API and the player's internal navigation).
    # `form-action 'self'` blocks credential posting to a third-party origin;
    # every form in the app posts to a first-party path.
    #
    # `script-src` is deliberately ABSENT, and this is a recorded residual
    # risk rather than an oversight. The production build emits Next.js
    # inline bootstrap scripts plus the service-worker registration script,
    # none of which carry a nonce. A `script-src` without `'unsafe-inline'`
    # would break the app; a `script-src` *with* `'unsafe-inline'` would
    # permit exactly the injected inline script an XSS policy is meant to
    # stop, so it would be a pretend hardening. Closing this needs
    # per-request nonces issued from proxy.ts and threaded through the Next
    # runtime — a separate architectural slice, tracked in
    # docs/operations/lesson-video.md.
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'; form-action 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com" always;

    # Lesson PDFs are accepted up to 200 MiB. The multipart envelope needs
    # modest headroom; the backend independently enforces PDF/image limits.
    client_max_body_size 210m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zhangak_connection_upgrade;
        proxy_hide_header X-Powered-By;
        # Preserve token streaming for the AI mentor and allow the existing
        # large knowledge-base processing requests to finish.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
