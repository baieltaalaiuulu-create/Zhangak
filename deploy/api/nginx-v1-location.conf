# Install inside the HTTPS server block only after the active frontend slice
# has passed integration tests against the API. The API itself binds to
# localhost and is not reachable from the public network before this switch.
location ^~ /v1/ {
    proxy_pass http://127.0.0.1:3210;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    proxy_buffering off;
}
