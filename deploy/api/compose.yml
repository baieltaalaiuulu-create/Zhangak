services:
  postgres:
    image: postgres:17.6-alpine
    container_name: zhangak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zhangak
      POSTGRES_USER: zhangak
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - zhangak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhangak -d zhangak"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_password:
    file: /etc/zhangak-api/postgres-password

volumes:
  zhangak-postgres-data:
    name: zhangak-postgres-data
